services:
  postgres:
    image: postgres:16-alpine
    container_name: ci-dashboard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ci_metrics
      POSTGRES_USER: grafana
      POSTGRES_PASSWORD: grafana
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grafana -d ci_metrics"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

  grafana:
    image: grafana/grafana:11.5.2
    container_name: ci-dashboard-grafana
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: dark
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ci-health.json
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro

volumes:
  postgres-data:
  grafana-data:
